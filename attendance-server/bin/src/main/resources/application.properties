spring.application.name=attendance-management

# ==============================
# Server Settings
# ==============================
server.port=8080
# ===============================
# = MySQL Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/attendance_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# = JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===============================
# = Logging
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================


# ===============================
# = Spring Security (optional)
# ===============================
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# ==============================
# H2 Database (In-Memory)
# ==============================


spring.datasource.driverClassName=org.h2.Driver



# JPA Configuration
# ==============================
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ==============================
# Logging
# ==============================
logging.level.org.springframework.web=INFO
# ==============================
# Spring Security (Default user)
# ==============================


# ==============================
# Allow overriding beans (helps when adding CORS/security configs)
# ==============================
spring.main.allow-bean-definition-overriding=true

# ==============================
# File Upload / CSV Export Settings
# ==============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# JWT Secret Key (from the previous step)
app.jwt.secret=aVeryLongAndComplexSecretKeyForAttendanceManagementSystem123456

# JWT Expiration Time in milliseconds (e.g., 1 hour = 3600000 ms)
app.jwt.expiration-ms=3600000
# 1. Missing app.jwt.secret: A long, random key for signing JWTs (must be at least 32 characters for strong security).

# 2. Missing app.jwt.expiration-ms: The duration a JWT token is valid for, in milliseconds.
# Example: 3600000 ms = 1 hour.


# 3. Missing app.frontend.origin: The URL of your client application (needed for CORS).
# Example: If your frontend runs on React/Vue default port.
app.frontend.origin=http://localhost:3000

# Optional: Add this property if you still see the CORS bean overriding warning.


